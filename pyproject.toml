[project]
name = "mission-control"
version = "0.1.0"
description = "Multi-tenant mission planning API and CLI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "fastapi>=0.115",
    "httpx2>=2.13",
    "rich>=13",
    "typer>=0.12",
    "uvicorn>=0.30",
]

[project.scripts]
mc = "mission_control.cli.main:main"
mc-admin = "mission_control.admin_cli:main"
mc-server = "mission_control.api.app:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mission_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]
extend-exclude = ["docs", ".claude", "transcripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
